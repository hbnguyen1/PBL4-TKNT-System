<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khai Báo Phương Tiện Mới - DriverWebDb</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="add-vehicle.css">
</head>
<body style="background-color: rgba(15, 23, 42, 0.6); font-family: system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; margin: 0; box-sizing: border-box;">

  <div class="vehicle-modal">
    <!-- Header -->
    <header class="vehicle-modal__header">
      <div class="vehicle-modal__header-left">
        <a href="vehicles.html" class="vehicle-modal__back-btn" title="Quay lại danh sách">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div>
          <h1 class="vehicle-modal__title">Khai Báo Phương Tiện Mới</h1>
          <p class="vehicle-modal__subtitle">Thêm xe mới vào đội vận hành và thiết lập thiết bị IoT giám sát</p>
        </div>
      </div>
    </header>

    <!-- Form Content -->
    <form action="vehicles.html" method="GET" class="vehicle-modal__form">
      <!-- Section 1 -->
      <section class="vehicle-modal__section">
        <div class="vehicle-modal__section-header">
          <i class="fa-solid fa-bus vehicle-modal__section-icon"></i>
          <h2 class="vehicle-modal__section-title">1. Thông Tin Cơ Bản Của Xe</h2>
        </div>

        <div class="vehicle-modal__grid vehicle-modal__grid--cols-2">
          <div class="vehicle-modal__group">
            <label class="vehicle-modal__label">Biển Số Xe <span class="vehicle-modal__required">*</span></label>
            <input type="text" name="license_plate" required placeholder="VD: 43B-019.88" class="vehicle-modal__control vehicle-modal__control--uppercase">
          </div>

          <div class="vehicle-modal__group">
            <label class="vehicle-modal__label">Tên Mẫu / Dòng Xe <span class="vehicle-modal__required">*</span></label>
            <input type="text" name="vehicle_name" required placeholder="VD: Thaco Mobihome..." class="vehicle-modal__control">
            <span class="vehicle-modal__hint">Loại xe, số chỗ hoặc dòng đời</span>
          </div>
        </div>
      </section>

      <!-- Section 2 -->
      <section class="vehicle-modal__section">
        <div class="vehicle-modal__section-header">
          <i class="fa-solid fa-microchip vehicle-modal__section-icon"></i>
          <h2 class="vehicle-modal__section-title">2. Cấu Hình Thiết Bị Giám Sát (IoT ESP32 & GPS)</h2>
        </div>

        <div class="vehicle-modal__group">
          <label class="vehicle-modal__label">Thông Tin Thiết Bị / Module GPS / Camera Buồng Lái</label>
          <div class="vehicle-modal__input-wrapper">
            <i class="fa-solid fa-satellite vehicle-modal__input-icon"></i>
            <input type="text" name="device_info" placeholder="VD: ESP32-CAM-03 (IP: 192.168.1.108)" class="vehicle-modal__control vehicle-modal__control--with-icon" style="font-family: monospace;">
          </div>
          <span class="vehicle-modal__hint">Ghi nhận địa chỉ IP RTSP của ESP32-CAM hoặc serial thiết bị</span>
        </div>
      </section>

      <!-- Footer Buttons -->
      <div class="vehicle-modal__footer">
        <button type="submit" class="vehicle-modal__submit-btn">
          <i class="fa-solid fa-floppy-disk"></i> Khai Báo Xe Vào Hệ Thống
        </button>
      </div>
    </form>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Tài Xế - DriverWebDb</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/base.css">
    <link rel="stylesheet" href="../../assets/pages/driver-profile.css">
</head>

<body class="driver-profile-page">

    <div class="page-header driver-profile-page__header">
        <div>
            <h1 class="page-header__title">Hồ Sơ Tài Xế</h1>
            <p class="page-header__subtitle">
                Xem và cập nhật thông tin tài khoản, hồ sơ cá nhân và trạng thái hoạt động
            </p>
        </div>
    </div>

    <form id="driverProfileForm"
          class="driver-profile-card"
          action="driver-overview.html"
          method="POST"
          enctype="multipart/form-data">

        <!-- THÔNG TIN ĐỊNH DANH -->
        <section class="driver-profile-card__body">

            <div class="driver-profile-identity">
                <div class="driver-profile-identity__info">
                    <div class="driver-profile-group driver-profile-group--full">
                        <label class="driver-profile__label" for="avatar">
                            Ảnh đại diện
                        </label>

                        <div class="driver-profile-avatar-upload">
                            <div class="driver-profile-avatar-upload__preview">
                                <img
                                    id="avatarUploadPreview"
                                    src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=160"
                                    alt="Ảnh đại diện hiện tại">
                            </div>

                            <div class="driver-profile-avatar-upload__content">
                                <label for="avatar" class="btn btn--secondary">
                                    <i class="fa-solid fa-camera"></i>
                                    Chọn ảnh mới
                                </label>
                                <input
                                    type="file"
                                    id="avatar"
                                    name="avatar"
                                    accept="image/png, image/jpeg, image/webp"
                                    hidden>
                            </div>
                        </div>
                    </div>

                    <div class="driver-profile-identity__content">
                        <h2 class="driver-profile-identity__name">Nguyễn Văn An</h2>
                        <p class="driver-profile-identity__sub">
                            Mã tài xế:
                            <strong>TX-101</strong>
                        </p>
                        <p class="driver-profile-identity__sub">
                            Tên đăng nhập:
                            <strong>vana_tx101</strong>
                        </p>
                        <p class="driver-profile-identity__sub">
                            Phương tiện phụ trách:
                            <strong>43B-012.34</strong>
                        </p>
                    </div>
                </div>
            </div>

            <!-- THÔNG TIN TÀI KHOẢN -->
            <section class="driver-profile-section">
                <div class="driver-profile-section__header">
                    <i class="fa-solid fa-shield-halved"></i>
                    <h2>1. Thông tin tài khoản đăng nhập</h2>
                </div>

                <div class="driver-profile-grid">
                    <div class="driver-profile-group">
                        <label class="driver-profile__label" for="username">
                            Tên đăng nhập (Username)
                            <span class="required-mark">*</span>
                        </label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            value="vana_tx101"
                            maxlength="50"
                            required
                            class="form-control"
                            placeholder="Nhập tên đăng nhập">
                        <small class="driver-profile__hint">
                            Tên đăng nhập phải là duy nhất trên hệ thống.
                        </small>
                    </div>

                    <div class="driver-profile-group">
                        <label for="driverPassword" class="driver-profile-label">
                            Mật khẩu
                        </label>

                        <div class="driver-profile-password">
                            <input
                                type="password"
                                id="driverPassword"
                                name="password"
                                class="form-control"
                                value="mật khẩu..."
                            >
                            <button
                                type="button"
                                class="driver-profile-password__toggle"
                                id="togglePassword"
                                aria-label="Hiện mật khẩu"
                                title="Hiện mật khẩu"
                            >
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- THÔNG TIN CÁ NHÂN -->
            <section class="driver-profile-section">
                <div class="driver-profile-section__header">
                    <i class="fa-solid fa-address-card"></i>
                    <h2>2. Thông tin hồ sơ cá nhân</h2>
                </div>

                <div class="driver-profile-grid">
                    <div class="driver-profile-group">
                        <label class="driver-profile__label" for="fullName">
                            Họ và tên tài xế
                            <span class="required-mark">*</span>
                        </label>
                        <input
                            type="text"
                            id="fullName"
                            name="full_name"
                            value="Nguyễn Văn An"
                            maxlength="100"
                            required
                            class="form-control"
                            placeholder="Nhập họ và tên">
                    </div>

                    <div class="driver-profile-group">
                        <label class="driver-profile__label" for="licenseType">
                            Hạng bằng lái
                            <span class="required-mark">*</span>
                        </label>
                        <select
                            id="licenseType"
                            name="license_type"
                            required
                            class="form-control">
                            <option value="Hạng B2">Hạng B2 - Xe du lịch</option>
                            <option value="Hạng C">Hạng C - Xe tải nặng</option>
                            <option value="Hạng D">Hạng D - Xe chở khách 16 - 30 chỗ</option>
                            <option value="Hạng E" selected>Hạng E - Xe chở khách trên 30 chỗ</option>
                        </select>
                    </div>

                    <div class="driver-profile-group">
                        <label class="driver-profile__label" for="phone">
                            Số điện thoại
                            <span class="required-mark">*</span>
                        </label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            value="0905 123 456"
                            required
                            class="form-control"
                            placeholder="VD: 0905 xxx xxx">
                    </div>

                    <div class="driver-profile-group">
                        <label class="driver-profile__label" for="dateOfBirth">
                            Ngày sinh
                        </label>
                        <input
                            type="date"
                            id="dateOfBirth"
                            name="date_of_birth"
                            value="1988-08-15"
                            class="form-control">
                    </div>

                    <div class="driver-profile-group driver-profile-group--full">
                        <label class="driver-profile__label" for="address">
                            Địa chỉ thường trú
                        </label>
                        <textarea
                            id="address"
                            name="address"
                            rows="3"
                            maxlength="255"
                            class="form-control"
                            placeholder="Nhập địa chỉ thường trú...">123 Đường Hải Phòng, Quận Thanh Khê, TP. Đà Nẵng</textarea>
                    </div>
                </div>
            </section>
            <p id="formMessage" class="driver-profile-message" role="status" aria-live="polite"></p>
        </section>

        <!-- FOOTER -->
        <footer class="driver-profile-card__footer">
            <button type="submit" id="saveButton" class="btn btn--primary">
                <i class="fa-solid fa-floppy-disk"></i>
                <span>Lưu hồ sơ</span>
            </button>
        </footer>
    </form>
</body>
</html>

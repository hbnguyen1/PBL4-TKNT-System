<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Đăng Nhập - DriverWebDb</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0b1120',
              card: '#1e293b',
              accent: '#2563eb',
              surface: '#f8fafc',
              border: '#e2e8f0'
            }
          }
        }
      }
    };
  </script>
</head>

<body class="bg-brand-dark min-h-screen flex items-center justify-center p-4 font-sans text-slate-800 relative overflow-hidden">

  <!-- BACKGROUND -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-600/15 rounded-full blur-3xl pointer-events-none"></div>

  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"></div>

  <!-- CONTAINER -->
  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-700/40 overflow-hidden relative z-10">

    <!-- HEADER -->
    <div class="bg-slate-950 px-8 pt-8 pb-7 text-center border-b border-slate-800">

      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-blue-600 text-white text-xl font-bold shadow-lg shadow-blue-500/30 mb-3">
        <i class="fa-solid fa-truck-fast"></i>
      </div>

      <h1 class="text-xl font-black text-white tracking-wide">
        DriverWebDb
      </h1>

      <p class="text-xs text-slate-400 mt-1">
        Hệ Thống Quản Lý Điều Hành & Hồ Sơ Đội Xe
      </p>
    </div>

    <!-- LOGIN FORM -->
    <div class="p-8">

      <form id="form-login" class="space-y-4">

        <!-- USERNAME -->
        <div>

          <label for="username"
                 class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
            Tên Đăng Nhập
          </label>

          <div class="relative">

            <i class="fa-regular fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>

            <input
              type="text"
              name="username"
              autocomplete="username"
              required
              placeholder="Nhập tên đăng nhập hoặc mã TX/AD..."
              class="w-full pl-10 pr-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-semibold text-slate-800 focus:outline-none focus:border-blue-600 focus:bg-white transition-all">
          </div>
        </div>

        <!-- PASSWORD -->
        <div>
          <div class="flex justify-between items-center mb-1.5">

            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">
              Mật Khẩu
            </label>

            <a href="#" id="forgot-password"
               class="text-[11px] text-blue-600 hover:underline font-semibold">
              Quên mật khẩu?
            </a>
          </div>

          <div class="relative">

            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>

            <input
              type="password"
              name="password"
              autocomplete="current-password"
              required
              placeholder="••••••••"
              class="w-full pl-10 pr-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-semibold text-slate-800 focus:outline-none focus:border-blue-600 focus:bg-white transition-all">
          </div>
        </div>

        <!-- REMEMBER -->
        <div class="flex items-center justify-between text-xs text-slate-600 pt-1">

          <label class="flex items-center gap-2 cursor-pointer">

            <input
              type="checkbox"
              id="remember-account"
              class="w-4 h-4 rounded text-blue-600 border-slate-300 focus:ring-blue-500">

            <span>Ghi nhớ tài khoản</span>
          </label>

          <div class="relative">

            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>

            <input
              id="password"
              type="password"
              name="password"
              autocomplete="current-password"
              required
              placeholder="Nhập mật khẩu..."
              class="w-full pl-10 pr-11 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-semibold text-slate-800 focus:outline-none focus:border-blue-600 focus:bg-white transition-all"
            >

            <!-- HIỆN / ẨN MẬT KHẨU -->
            <button
              type="button"
              id="toggle-password"
              aria-label="Hiện mật khẩu"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-blue-600"
            >
              <i id="eye-icon" class="fa-regular fa-eye"></i>
            </button>

          </div>
        </div>

        <!-- ERROR MESSAGE -->
        <p id="login-message"
           role="alert"
           aria-live="polite"
           class="text-xs text-red-600 text-center hidden">
        </p>

        <!-- LOGIN BUTTON -->
        <button
          type="submit"
          id="login-button"
          class="w-full mt-3 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold tracking-wide shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2">

          <span>Đăng Nhập Vào Hệ Thống</span>

          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>

      </form>
    </div>
  </div>

  <script>
    document.getElementById("form-login")
      .addEventListener("submit", async function (event) {

        event.preventDefault();

        const username = this.elements["username"].value.trim();
        const password = this.elements["password"].value;

        const button = document.getElementById("login-button");
        const message = document.getElementById("login-message");

        message.classList.add("hidden");
        message.textContent = "";

        if (!username || !password) {
          message.textContent = "Vui lòng nhập đầy đủ thông tin!";
          message.classList.remove("hidden");
          return;
        }

        button.disabled = true;
        button.querySelector("span").textContent = "Đang đăng nhập...";

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              username: username,
              password: password
            })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(
              data.message || "Đăng nhập thất bại!"
            );
          }

          if (data.role === "Admin") {
            window.location.replace("/index.html");
          }
          else if (data.role === "Driver") {
            window.location.replace("/driver/index.html");
          }
          else {
            throw new Error(
              "Tài khoản chưa được phân quyền truy cập."
            );
          }

        } catch (error) {
          message.textContent = error.message;
          message.classList.remove("hidden");

          button.disabled = false;
          button.querySelector("span").textContent =
            "Đăng Nhập Vào Hệ Thống";
        }
      });

    document.getElementById("forgot-password")
      .addEventListener("click", function (event) {
        event.preventDefault();
        alert("Vui lòng liên hệ quản trị viên để được hỗ trợ đặt lại mật khẩu.");
      });
  </script>

</body>
</html>

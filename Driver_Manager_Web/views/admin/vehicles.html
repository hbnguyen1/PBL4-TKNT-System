
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý & Điều Phối Phương Tiện - DriverWebDb</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/base.css">
  <link rel="stylesheet" href="../../assets/pages/vehicles.css">
</head>

<body class="vehicles-page">

  <!-- HEADER -->
  <div class="page-header">
    <div>
      <h1 class="page-header__title">
        Quản Lý & Điều Phối Phương Tiện
      </h1>

      <p class="page-header__subtitle">
        Kiểm soát danh sách xe, phân bổ tuyến hoạt động
        và cấu hình thiết bị IoT
      </p>
    </div>

    <a href="add-vehicle.html" class="btn btn--primary">
      <i class="fa-solid fa-plus"></i>
      <span>Khai Báo Phương Tiện Mới</span>
    </a>
  </div>

  <!-- BỘ LỌC -->
  <section class="vehicles-filter">

    <div class="vehicles-filter__search">
      <i class="fa-solid fa-magnifying-glass vehicles-filter__icon"></i>

      <input
        type="text"
        id="searchVehicle"
        placeholder="Tìm kiếm theo biển số xe, dòng xe, tuyến hoặc tài xế..."
        class="form-control vehicles-filter__input"
      >
    </div>

    <div class="vehicles-filter__group">
      <select
        id="filterStatus"
        class="form-control"
        style="width:11rem;"
      >
        <option value="">Tất cả trạng thái</option>
        <option value="assigned">Đã phân công</option>
        <option value="unassigned">Chờ tài xế</option>
      </select>
    </div>

  </section>

  <!-- BẢNG DANH SÁCH XE -->
  <div class="data-card">
    <div class="table-wrapper">

      <table class="data-table">

        <thead class="data-table__head">
          <tr>
            <th class="data-table__th">
              Biển Số Xe
            </th>

            <th class="data-table__th">
              Dòng Xe / Hãng Sản Xuất
            </th>

            <th class="data-table__th">
              Tuyến Hoạt Động (Route)
            </th>

            <th class="data-table__th">
              Tài Xế Phụ Trách
            </th>

            <th class="data-table__th">
              Trạng Thái
            </th>

            <th
              class="data-table__th"
              style="text-align:center;"
            >
              Hành Động
            </th>
          </tr>
        </thead>

        <tbody
          id="vehicleTableBody"
          class="data-table__body"
        >
          <tr>
            <td
              colspan="6"
              class="data-table__td"
              style="text-align:center;"
            >
              Đang tải danh sách phương tiện...
            </td>
          </tr>
        </tbody>

      </table>

    </div>
  </div>


</body>
</html>


<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khai Báo Phương Tiện Mới - DriverWebDb</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/base.css">
  <link rel="stylesheet" href="../../assets/pages/add-vehicle.css">
</head>

<body>
  <div class="page-header" style="max-width:48rem;margin:0 auto 1.5rem auto;">
    <div>
      <h1 class="page-header__title">Khai Báo Phương Tiện Mới</h1>
      <p class="page-header__subtitle">
        Thêm xe mới vào đội vận hành và thiết lập thiết bị IoT giám sát
      </p>
    </div>

    <a href="vehicles.html" class="btn btn--secondary">
      <i class="fa-solid fa-arrow-left"></i> Trở Lại
    </a>
  </div>

  <form id="form-add-vehicle" class="add-vehicle-card">
    <div class="add-vehicle-card__body">

      <!-- PHẦN 1: THÔNG TIN XE -->
      <section class="add-vehicle-card__section">
        <div class="add-vehicle-card__section-header">
          <i class="fa-solid fa-bus" style="color:var(--color-primary);"></i>
          <h2 class="add-vehicle-card__section-title">
            1. Thông Tin Định Danh Xe
          </h2>
        </div>

        <div class="add-vehicle-card__grid">
          <div class="add-vehicle-card__group">
            <label for="license-plate" class="add-vehicle-card__label">
              Biển Số Xe (license_plate)
              <span style="color:var(--color-danger);">*</span>
            </label>

            <input
              id="license-plate"
              type="text"
              name="license_plate"
              placeholder="VD: 43B-019.88"
              required
              maxlength="20"
              class="form-control"
              style="font-family:monospace;text-transform:uppercase;font-weight:700;"
            >
          </div>

          <div class="add-vehicle-card__group">
            <label for="vehicle-name" class="add-vehicle-card__label">
              Tên Dòng Xe (vehicle_name)
              <span style="color:var(--color-danger);">*</span>
            </label>

            <input
              id="vehicle-name"
              type="text"
              name="vehicle_name"
              placeholder="VD: Thaco Mobihome 2024"
              required
              maxlength="100"
              class="form-control"
            >
          </div>
        </div>
      </section>

      <!-- PHẦN 2: IOT -->
      <section class="add-vehicle-card__section">
        <div class="add-vehicle-card__section-header">
          <i class="fa-solid fa-microchip" style="color:var(--color-primary);"></i>
          <h2 class="add-vehicle-card__section-title">
            2. Cấu Hình Thiết Bị IoT Giám Sát
          </h2>
        </div>

        <div class="add-vehicle-card__group">
          <label for="device-info" class="add-vehicle-card__label">
            Thông Tin Camera (device_info)
          </label>

          <input
            id="device-info"
            type="text"
            name="device_info"
            maxlength="150"
            placeholder="VD: ESP32-CAM-03 (IP: 10.10.48.203) | GPS-NEO6M-BK"
            class="form-control"
            style="font-family:monospace;"
          >
        </div>
      </section>

      <!-- PHẦN 3: TUYẾN ĐƯỜNG -->
      <section class="add-vehicle-card__section">
        <div class="add-vehicle-card__section-header">
          <i class="fa-solid fa-route" style="color:var(--color-primary);"></i>
          <h2 class="add-vehicle-card__section-title">
            3. Tuyến Đường & Trạng Thái
          </h2>
        </div>

        <div class="add-vehicle-card__grid">
          <div class="add-vehicle-card__group">
            <label for="vehicle-route" class="add-vehicle-card__label">
              Tuyến Hoạt Động (Route)
            </label>

            <input
              id="vehicle-route"
              type="text"
              name="route"
              maxlength="150"
              placeholder="VD: Đà Nẵng - Huế"
              class="form-control"
            >
          </div>

          <div class="add-vehicle-card__group">
            <label class="add-vehicle-card__label">
              Trạng Thái Ban Đầu
            </label>

            <input
              type="text"
              value="Chờ tài xế (chưa phân công)"
              readonly
              class="form-control"
            >

            <small style="display:block;margin-top:0.4rem;opacity:0.75;">
              Có thể phân công tài xế tại trang Chi Tiết sau khi tạo xe.
            </small>
          </div>
        </div>
      </section>

      <!-- THÔNG BÁO -->
      <p
        id="form-message"
        role="status"
        aria-live="polite"
        style="display:none;margin:1rem 0;">
      </p>

    </div>

    <footer class="add-vehicle-card__footer">
      <button id="btn-submit" type="submit" class="btn btn--primary">
        <i class="fa-solid fa-floppy-disk"></i>
        Khai Báo Xe Vào Bãi
      </button>
    </footer>
  </form>



</body>
</html>

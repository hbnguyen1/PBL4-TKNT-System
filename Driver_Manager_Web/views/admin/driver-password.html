<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Đổi mật khẩu tài xế</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="/assets/base.css">

  <link rel="stylesheet"
        href="/assets/pages/admin-detail.css">

</head>

<body>

  <!-- HEADER -->
  <div class="page-header"
       style="max-width: 36rem; margin: 0 auto 1.5rem;">

    <div>

      <h1 class="page-header__title">
        Cài Đặt Tài Khoản Tài xế
      </h1>

      <p class="page-header__subtitle">
        Xem thông tin và cập nhật mật khẩu tài khoản 
      </p>

    </div>

  </div>

  <!-- FORM -->
  <form id="password-form" class="admin-detail-card">

    <div class="admin-detail-card__body">

      <!-- MÃ TÀI KHOẢN -->
      <div class="admin-detail-card__group">

        <label class="admin-detail-card__label">
          Mã Tài Khoản
        </label>

        <input
          type="text"
          id="driver-id"
          value="Đang tải..."
          readonly
          class="form-control form-control--readonly">
      </div>

      <!-- USERNAME -->
      <div class="admin-detail-card__group">

        <label class="admin-detail-card__label">
          Tên Đăng Nhập
        </label>

        <input
          type="text"
          id="driver-username"
          value="Đang tải..."
          readonly
          class="form-control form-control--readonly">

      </div>

      <!-- ĐỔI MẬT KHẨU -->
      <div class="admin-detail-card__group"
           style="
             border-top: 1px solid #e2e8f0;
             padding-top: 20px;
             margin-top: 15px;">

        <label class="admin-detail-card__label"
               style="color: #2563eb;">

          <i class="fa-solid fa-lock"></i>
          Đổi Mật Khẩu

        </label>

      </div>
      
      <!-- MẬT KHẨU MỚI -->
      <div class="admin-detail-card__group">

        <label class="admin-detail-card__label"
               for="newPassword">
          Mật Khẩu Mới
        </label>

        <input
          type="password"
          id="newPassword"
          name="newPassword"
          placeholder="Nhập mật khẩu mới..."
          autocomplete="new-password"
          minlength="8"
          maxlength="128"
          required
          class="form-control">

      </div>

      <!-- XÁC NHẬN MẬT KHẨU -->
      <div class="admin-detail-card__group">

        <label class="admin-detail-card__label"
               for="confirmPassword">
          Xác Nhận Mật Khẩu Mới
        </label>

        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="Nhập lại mật khẩu mới..."
          autocomplete="new-password"
          minlength="8"
          maxlength="128"
          required
          class="form-control">

      </div>

      <!-- THÔNG BÁO -->
      <div class="admin-detail-card__group">

        <p id="password-message"
           role="status"
           aria-live="polite"
           style="
             font-size: 13px;
             font-weight: 500;
             margin-top: 10px;">
        </p>

      </div>

    </div>

    <!-- FOOTER -->
    <footer class="admin-detail-card__footer">

      <button type="submit"
              id="btn-save"
              class="btn btn--primary">

        <i class="fa-solid fa-floppy-disk"></i>
        Cập Nhật Mật Khẩu

      </button>

    </footer>

  </form>
  <script src="/assets/js/driver-password.js"></script>
</body>
</html>

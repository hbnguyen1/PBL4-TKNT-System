<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiểm duyệt vi phạm - DriverWebDb</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/pages/demerits.css?v=violation-history">
</head>
<body class="demerits-page">
  <div class="page-header">
    <div>
      <h1 class="page-header__title">Kiểm Duyệt Vi Phạm Kỷ Luật &amp; Bằng Chứng IoT</h1>
      <p class="page-header__subtitle">Sử dụng điện thoại trừ 3 điểm, buồn ngủ trừ 1 điểm. Mỗi điểm tương ứng 100.000 đồng. Chỉ xóa được biên bản của tháng hiện tại khi lương chưa chốt.</p>
    </div>
  </div>

  <form id="violation-filters" class="demerits-filter">
    <div class="demerits-filter__search">
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      <input name="search" type="search" maxlength="100" aria-label="Tìm tài xế"
        placeholder="Tìm tên hoặc mã TX..." class="form-control">
    </div>
    <select name="month" class="form-control" aria-label="Tháng">
      <option value="">Tất cả tháng</option>
    </select>
    <input name="year" type="number" min="1" max="9999" placeholder="Năm" aria-label="Năm" class="form-control">
    <button class="btn btn--secondary" type="submit">Lọc</button>
  </form>

  <div class="data-card">
    <div class="demerits-table-scroll">
      <table class="data-table">
        <thead class="data-table__head">
          <tr>
            <th class="data-table__th" scope="col">Mã Biên Bản</th>
            <th class="data-table__th" scope="col">Tài Xế</th>
            <th class="data-table__th" scope="col">Lỗi Vi Phạm</th>
            <th class="data-table__th demerits-center" scope="col">Ảnh Bằng Chứng</th>
            <th class="data-table__th demerits-center" scope="col">Điểm Trừ</th>
            <th class="data-table__th" scope="col">Thời Gian</th>
            <th class="data-table__th demerits-center" scope="col">Phê Duyệt</th>
          </tr>
        </thead>
        <tbody class="data-table__body" id="violation-rows"></tbody>
      </table>
    </div>
    <div class="demerits-table-footer">
      <p id="violation-status" role="status"></p>
      <button id="violation-more" class="btn btn--secondary" type="button" hidden>Xem thêm</button>
    </div>
  </div>
  <script src="/assets/js/violation-deletion-sync.js?v=violation-sync"></script>
  <script src="/assets/js/demerits.js?v=violation-sync"></script>
</body>
</html>
